<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" font-family="ui-monospace, SF Mono, Menlo, monospace">
  <style>
    .title { font: 600 14px sans-serif; fill: #111827; }
    .small { font: 11px sans-serif; fill: #4b5563; }
    .life  { font: 12px sans-serif; fill: #111827; text-anchor: middle; font-weight: 600; }
    .msg   { font: 11px ui-monospace, monospace; fill: #111827; text-anchor: middle; }
    .ms    { font: 11px ui-monospace, monospace; fill: #6b7280; text-anchor: end; }
    .dns   { stroke: #f59e0b; }
    .tcp   { stroke: #3b82f6; }
    .tls   { stroke: #22c55e; }
    .http  { stroke: #8b5cf6; }
    .bandD { fill: #fef3c7; }
    .bandT { fill: #dbeafe; }
    .bandS { fill: #dcfce7; }
    .bandH { fill: #ede9fe; }
  </style>

  <text x="20" y="26" class="title">엔터 → 첫 바이트(TTFB): DNS → TCP → TLS 1.3 → HTTP  (RTT 50ms 가정)</text>

  <!-- phase bands -->
  <rect x="70"  y="66" width="660" height="66"  class="bandD"/>
  <rect x="70"  y="132" width="660" height="96" class="bandT"/>
  <rect x="70"  y="228" width="660" height="96" class="bandS"/>
  <rect x="70"  y="324" width="660" height="120" class="bandH"/>

  <!-- lifelines -->
  <line x1="150" y1="60" x2="150" y2="520" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <line x1="390" y1="60" x2="390" y2="520" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <line x1="650" y1="60" x2="650" y2="520" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <text x="150" y="54" class="life">브라우저</text>
  <text x="390" y="54" class="life">DNS 리졸버</text>
  <text x="650" y="54" class="life">웹 서버</text>

  <!-- DNS -->
  <line x1="150" y1="86"  x2="388" y2="100" class="dns" stroke-width="2" marker-end="url(#aO)"/>
  <text x="265" y="82"  class="msg">A? www.site.com</text>
  <line x1="388" y1="116" x2="152" y2="128" class="dns" stroke-width="2" marker-end="url(#aO)"/>
  <text x="265" y="128" class="msg">203.0.113.9 (TTL 300s)</text>
  <text x="66"  y="104" class="ms">~30ms</text>

  <!-- TCP -->
  <line x1="150" y1="150" x2="648" y2="164" class="tcp" stroke-width="2" marker-end="url(#aO)"/>
  <text x="400" y="146" class="msg">SYN</text>
  <line x1="648" y1="178" x2="152" y2="192" class="tcp" stroke-width="2" marker-end="url(#aO)"/>
  <text x="400" y="190" class="msg">SYN + ACK</text>
  <line x1="150" y1="206" x2="648" y2="220" class="tcp" stroke-width="2" marker-end="url(#aO)"/>
  <text x="400" y="216" class="msg">ACK  (3-way 완료)</text>
  <text x="66"  y="188" class="ms">+50ms</text>
  <text x="66"  y="202" class="ms">=80ms</text>

  <!-- TLS 1.3 -->
  <line x1="150" y1="246" x2="648" y2="260" class="tls" stroke-width="2" marker-end="url(#aO)"/>
  <text x="400" y="242" class="msg">ClientHello + key_share</text>
  <line x1="648" y1="274" x2="152" y2="288" class="tls" stroke-width="2" marker-end="url(#aO)"/>
  <text x="400" y="286" class="msg">ServerHello + 인증서 + Finished</text>
  <text x="66"  y="284" class="ms">+50ms</text>
  <text x="66"  y="298" class="ms">=130ms</text>

  <!-- HTTP -->
  <line x1="150" y1="344" x2="648" y2="358" class="http" stroke-width="2" marker-end="url(#aO)"/>
  <text x="400" y="340" class="msg">Finished + GET /index.html</text>
  <rect x="622" y="372" width="56" height="30" fill="#ddd6fe" stroke="#8b5cf6"/>
  <text x="650" y="391" class="msg">서버 처리</text>
  <line x1="648" y1="418" x2="152" y2="432" class="http" stroke-width="2" marker-end="url(#aO)"/>
  <text x="400" y="430" class="msg">200 OK — 첫 바이트!</text>
  <text x="66"  y="360" class="ms">+25ms</text>
  <text x="66"  y="436" class="ms">~175ms</text>

  <!-- summary -->
  <text x="20" y="474" class="title">핵심: 첫 바이트 전에 RTT를 3~4번 왕복한다 → 지연은 대역폭이 아니라 왕복 횟수가 지배</text>
  <g transform="translate(20,486)" class="small">
    <text y="14"><tspan fill="#f59e0b" font-weight="600">DNS</tspan> 캐시되면 0ms &#160;·&#160; <tspan fill="#3b82f6" font-weight="600">TCP</tspan> 1 RTT &#160;·&#160; <tspan fill="#22c55e" font-weight="600">TLS 1.3</tspan> 1 RTT (1.2는 2 RTT) &#160;·&#160; <tspan fill="#8b5cf6" font-weight="600">0-RTT 재개</tspan> 시 TLS 왕복 생략</text>
    <text y="32">→ preconnect는 DNS+TCP+TLS를 미리 끝내 두는 것. HTTP/3(QUIC)는 TCP+TLS를 1 RTT로 합침.</text>
  </g>

  <defs>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
