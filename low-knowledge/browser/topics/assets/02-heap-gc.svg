<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="ui-monospace, SF Mono, Menlo, monospace">
  <style>
    .title { font: 600 14px sans-serif; fill: #111827; }
    .small { font: 11px sans-serif; fill: #4b5563; }
    .lab   { font: 12px ui-monospace, monospace; fill: #111827; text-anchor: middle; }
    .sub   { font: 10px sans-serif; fill: #6b7280; text-anchor: middle; }
    .newsp { fill: #dbeafe; stroke: #3b82f6; }
    .oldsp { fill: #ede9fe; stroke: #8b5cf6; }
    .live  { fill: #86efac; stroke: #22c55e; }
    .dead  { fill: #fecaca; stroke: #ef4444; }
    .arrow { stroke: #374151; stroke-width: 1.6; fill: none; }
    .promo { stroke: #8b5cf6; stroke-width: 2; fill: none; }
  </style>

  <text x="20" y="26" class="title">세대별 GC — 대부분의 객체는 젊어서 죽는다 (세대 가설)</text>

  <!-- New space -->
  <g transform="translate(30,55)">
    <rect width="380" height="180" class="newsp"/>
    <text x="190" y="24" class="lab">New Space (nursery) · 수 MB · Scavenge</text>

    <text x="95" y="52" class="sub">From space</text>
    <rect x="20" y="60" width="150" height="100" fill="#fff" stroke="#3b82f6"/>
    <rect x="30" y="72" width="26" height="20" class="live"/>
    <rect x="62" y="72" width="26" height="20" class="dead"/>
    <rect x="94" y="72" width="26" height="20" class="live"/>
    <rect x="30" y="98" width="26" height="20" class="dead"/>
    <rect x="62" y="98" width="26" height="20" class="dead"/>
    <rect x="94" y="98" width="26" height="20" class="live"/>
    <text x="95" y="150" class="sub">GC 전: 살아있는 것만 복사</text>

    <text x="285" y="52" class="sub">To space</text>
    <rect x="210" y="60" width="150" height="100" fill="#fff" stroke="#3b82f6"/>
    <rect x="222" y="72" width="26" height="20" class="live"/>
    <rect x="254" y="72" width="26" height="20" class="live"/>
    <rect x="286" y="72" width="26" height="20" class="live"/>
    <text x="285" y="150" class="sub">복사 후: 빈틈 없이 압축</text>

    <line x1="172" y1="110" x2="208" y2="110" class="arrow" marker-end="url(#a)"/>
    <text x="190" y="102" class="sub">copy</text>
  </g>

  <!-- Old space -->
  <g transform="translate(460,55)">
    <rect width="370" height="180" class="oldsp"/>
    <text x="185" y="24" class="lab">Old Space · 큼 · Mark-Sweep-Compact</text>

    <rect x="24" y="46" width="322" height="30" fill="#fff" stroke="#8b5cf6"/>
    <text x="185" y="66" class="sub">1) Mark: root에서 도달 가능한 객체 표시</text>
    <rect x="24" y="84" width="322" height="30" fill="#fff" stroke="#8b5cf6"/>
    <text x="185" y="104" class="sub">2) Sweep: 표시 안 된 객체 회수</text>
    <rect x="24" y="122" width="322" height="30" fill="#fff" stroke="#8b5cf6"/>
    <text x="185" y="142" class="sub">3) Compact: 단편화 제거로 압축</text>
    <text x="185" y="170" class="sub">incremental · concurrent 로 pause 를 쪼갬</text>
  </g>

  <!-- promotion -->
  <path d="M320 200 C 320 270, 645 270, 645 238" class="promo" marker-end="url(#p)"/>
  <text x="480" y="286" class="sub" fill="#8b5cf6">2회 Scavenge 생존 → promote (승격)</text>

  <!-- reachability note -->
  <g transform="translate(30,300)">
    <rect width="800" height="70" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="16" y="24" class="small">도달성(reachability) 기반: root(콜 스택·전역)에서 참조로 못 닿으면 garbage. 참조 카운팅이 아니라 순환 참조도 회수된다.</text>
    <text x="16" y="46" class="small">누수 = GC 버그가 아니라 "의도치 않게 root에서 도달 가능": 클로저 캡처 · 안 뗀 리스너 · detached DOM · 무한 전역 캐시.</text>
    <text x="16" y="62" class="small" fill="#8b5cf6">WeakMap/WeakRef = "있으면 쓰고 없으면 말고" — key가 죽으면 entry 자동 소멸 → 캐시 누수 방지.</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#374151"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/></marker>
  </defs>
</svg>
