<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="ui-monospace, SF Mono, Menlo, monospace">
  <style>
    .title { font: 600 14px sans-serif; fill: #111827; }
    .small { font: 11px sans-serif; fill: #4b5563; }
    .lab   { font: 12px ui-monospace, monospace; fill: #111827; text-anchor: middle; }
    .sub   { font: 10px sans-serif; fill: #6b7280; text-anchor: middle; }
    .stack { fill: #bfdbfe; stroke: #3b82f6; }
    .web   { fill: #fde68a; stroke: #f59e0b; }
    .macro { fill: #fed7aa; stroke: #ea580c; }
    .micro { fill: #bbf7d0; stroke: #22c55e; }
    .render{ fill: #ddd6fe; stroke: #8b5cf6; }
    .loop  { fill: none; stroke: #ef4444; stroke-width: 2; }
    .arrow { stroke: #374151; stroke-width: 1.5; fill: none; }
  </style>

  <text x="20" y="26" class="title">이벤트 루프 — 콜 스택이 비면 큐에서 하나씩. 매크로 1개마다 마이크로는 전부 비운다</text>

  <!-- Call stack -->
  <g transform="translate(30,60)">
    <rect width="200" height="150" class="stack"/>
    <text x="100" y="22" class="lab">Call Stack (싱글 스레드)</text>
    <rect x="20" y="40"  width="160" height="26" fill="#fff" stroke="#3b82f6"/>
    <text x="100" y="58" class="sub">main()</text>
    <rect x="20" y="72"  width="160" height="26" fill="#fff" stroke="#3b82f6"/>
    <text x="100" y="90" class="sub">handleClick()</text>
    <rect x="20" y="104" width="160" height="26" fill="#fff" stroke="#3b82f6"/>
    <text x="100" y="122" class="sub">compute()  ← top</text>
    <text x="100" y="146" class="sub">한 번에 하나만 실행</text>
  </g>

  <!-- Web APIs / libuv -->
  <g transform="translate(30,240)">
    <rect width="200" height="140" class="web"/>
    <text x="100" y="22" class="lab">Web API / libuv</text>
    <text x="100" y="42" class="sub">(런타임이 대신 처리)</text>
    <text x="100" y="66" class="sub">setTimeout 타이머</text>
    <text x="100" y="84" class="sub">fetch / XHR</text>
    <text x="100" y="102" class="sub">DOM 이벤트</text>
    <text x="100" y="120" class="sub">disk / socket (epoll)</text>
  </g>

  <!-- Event loop center -->
  <g transform="translate(370,190)">
    <circle cx="60" cy="60" r="58" class="loop"/>
    <text x="60" y="55" class="lab" fill="#ef4444">Event</text>
    <text x="60" y="72" class="lab" fill="#ef4444">Loop</text>
    <text x="60" y="132" class="sub">스택 비었나?</text>
  </g>

  <!-- Microtask queue -->
  <g transform="translate(560,70)">
    <rect width="270" height="120" class="micro"/>
    <text x="135" y="22" class="lab">Microtask Queue (우선)</text>
    <text x="135" y="42" class="sub">Promise.then · await 이후 · queueMicrotask</text>
    <rect x="16" y="54" width="70" height="46" fill="#fff" stroke="#22c55e"/>
    <rect x="98" y="54" width="70" height="46" fill="#fff" stroke="#22c55e"/>
    <rect x="180" y="54" width="70" height="46" fill="#fff" stroke="#22c55e"/>
    <text x="135" y="115" class="sub">매 태스크 후 큐가 빌 때까지 전부 실행</text>
  </g>

  <!-- Macrotask queue -->
  <g transform="translate(560,210)">
    <rect width="270" height="90" class="macro"/>
    <text x="135" y="22" class="lab">Macrotask Queue (task)</text>
    <text x="135" y="42" class="sub">setTimeout · I/O · UI 이벤트 · setInterval</text>
    <rect x="30" y="52" width="70" height="28" fill="#fff" stroke="#ea580c"/>
    <rect x="112" y="52" width="70" height="28" fill="#fff" stroke="#ea580c"/>
    <text x="216" y="72" class="sub">한 사이클에 1개만</text>
  </g>

  <!-- Render step -->
  <g transform="translate(560,320)">
    <rect width="270" height="60" class="render"/>
    <text x="135" y="24" class="lab">Render (rAF → 스타일·레이아웃·페인트)</text>
    <text x="135" y="46" class="sub">브라우저: 프레임당 최대 1회, ~16.6ms 간격</text>
  </g>

  <line x1="230" y1="130" x2="368" y2="180" class="arrow" marker-end="url(#a)"/>
  <text x="300" y="150" class="sub">비동기 등록</text>
  <line x1="230" y1="300" x2="368" y2="255" class="arrow" marker-end="url(#a)"/>
  <text x="300" y="292" class="sub">완료 → 큐로</text>
  <line x1="488" y1="230" x2="558" y2="230" class="arrow" marker-end="url(#a)"/>
  <line x1="488" y1="150" x2="558" y2="150" class="arrow" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#374151"/></marker>
  </defs>
</svg>
