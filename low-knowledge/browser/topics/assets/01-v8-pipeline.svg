<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="ui-monospace, SF Mono, Menlo, monospace">
  <style>
    .title { font: 600 14px sans-serif; fill: #111827; }
    .small { font: 11px sans-serif; fill: #4b5563; }
    .lab   { font: 12px ui-monospace, monospace; fill: #111827; text-anchor: middle; }
    .sub   { font: 10px sans-serif; fill: #6b7280; text-anchor: middle; }
    .src   { fill: #e5e7eb; stroke: #9ca3af; }
    .parse { fill: #fde68a; stroke: #f59e0b; }
    .bc    { fill: #bfdbfe; stroke: #3b82f6; }
    .jit   { fill: #bbf7d0; stroke: #22c55e; }
    .deopt { fill: #fecaca; stroke: #ef4444; }
    .arrow { stroke: #374151; stroke-width: 1.6; fill: none; }
    .fb    { stroke: #8b5cf6; stroke-width: 1.6; fill: none; stroke-dasharray: 2 3; }
    .back  { stroke: #ef4444; stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
  </style>

  <text x="20" y="26" class="title">V8 파이프라인 — 인터프리트로 시작해서 hot 코드만 JIT, 가정 깨지면 deopt</text>

  <!-- top row: source to optimized -->
  <g transform="translate(0,50)">
    <rect x="20"  y="20" width="120" height="54" class="src"/>
    <text x="80"  y="42" class="lab">JS 소스</text>
    <text x="80"  y="60" class="sub">const x = a + b</text>

    <rect x="185" y="20" width="120" height="54" class="parse"/>
    <text x="245" y="42" class="lab">Parser</text>
    <text x="245" y="60" class="sub">scanner · lazy</text>

    <rect x="350" y="20" width="90" height="54" class="parse"/>
    <text x="395" y="46" class="lab">AST</text>

    <rect x="485" y="20" width="150" height="54" class="bc"/>
    <text x="560" y="42" class="lab">Ignition</text>
    <text x="560" y="60" class="sub">바이트코드 인터프리트</text>

    <rect x="700" y="20" width="140" height="54" class="jit"/>
    <text x="770" y="42" class="lab">TurboFan / Maglev</text>
    <text x="770" y="60" class="sub">최적화된 기계어</text>

    <line x1="140" y1="47" x2="183" y2="47" class="arrow" marker-end="url(#a)"/>
    <line x1="305" y1="47" x2="348" y2="47" class="arrow" marker-end="url(#a)"/>
    <line x1="440" y1="47" x2="483" y2="47" class="arrow" marker-end="url(#a)"/>
    <line x1="635" y1="47" x2="698" y2="47" class="arrow" marker-end="url(#a)"/>
    <text x="666" y="40" class="sub">hot?</text>
  </g>

  <!-- feedback loop: Ignition collects type feedback -> TurboFan -->
  <g transform="translate(0,50)">
    <path d="M560 74 C 560 120, 770 120, 770 74" class="fb" marker-end="url(#v)"/>
    <text x="665" y="118" class="sub" fill="#8b5cf6">feedback vector (관찰된 타입) 로 speculation</text>
  </g>

  <!-- deopt: TurboFan back to Ignition -->
  <g transform="translate(0,50)">
    <path d="M770 74 C 770 175, 560 175, 560 78" class="back" marker-end="url(#d)"/>
    <rect x="600" y="150" width="130" height="24" class="deopt"/>
    <text x="665" y="166" class="lab">deopt (bailout)</text>
    <text x="665" y="196" class="sub" fill="#ef4444">타입 가정 위반 → 바이트코드로 롤백</text>
  </g>

  <!-- object model inset -->
  <g transform="translate(20,270)">
    <text x="0" y="0" class="title">빠른 객체 접근: Hidden Class(Shape) + Inline Cache</text>
    <rect x="0"   y="14" width="230" height="86" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="115" y="34" class="lab">Hidden Class C0</text>
    <text x="14"  y="56" class="sub" text-anchor="start">{ x: offset 0, y: offset 1 }</text>
    <text x="14"  y="74" class="sub" text-anchor="start">같은 shape 객체는 같은 offset</text>
    <text x="14"  y="92" class="sub" text-anchor="start">→ 배열 인덱싱처럼 O(1) 접근</text>

    <rect x="270" y="14" width="290" height="86" fill="#ecfdf5" stroke="#22c55e"/>
    <text x="415" y="34" class="lab">Inline Cache @ obj.x 접근 지점</text>
    <text x="284" y="56" class="sub" text-anchor="start">monomorphic: shape 1개 → 최속</text>
    <text x="284" y="74" class="sub" text-anchor="start">polymorphic: 2~4개 → 조금 느림</text>
    <text x="284" y="92" class="sub" text-anchor="start">megamorphic: 5개+ → IC 포기, 최적화 방해</text>

    <rect x="600" y="14" width="240" height="86" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="720" y="34" class="lab">CPU 캐시와 동형</text>
    <text x="614" y="56" class="sub" text-anchor="start">IC hit ≈ 데이터 캐시 hit</text>
    <text x="614" y="74" class="sub" text-anchor="start">shape 일관성 ≈ 캐시 지역성</text>
    <text x="614" y="92" class="sub" text-anchor="start">speculation/deopt ≈ 분기예측/flush</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#374151"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/></marker>
  </defs>
</svg>
